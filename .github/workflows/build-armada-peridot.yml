name: Build Armada-Dodge Peridot

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-armada-peridot.yml'
      - 'scripts/**'
      - 'firmware/**'
      - 'peridot.dtb'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux kernel version'
        required: true
        default: '6.12'
      media_size_mb:
        description: 'FAT media image size in MB'
        required: true
        default: '2048'

concurrency:
  group: armada-peridot-full-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: ${{ github.workspace }}/peridot-workspace
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '6.12' }}
  MEDIA_SIZE_MB: ${{ github.event.inputs.media_size_mb || '2048' }}
  BOOTARGS: console=ttyMSM0,115200n8 earlycon loglevel=7 ignore_loglevel
  LLVM: /usr/bin
  LD: /usr/bin/ld.lld
  CROSS_COMPILE: aarch64-linux-gnu-
  ARCH: arm64

jobs:
  build:
    name: Build kernel, DTB, initrd and media
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout armada-peridot
        uses: actions/checkout@v4
        with:
          repository: hoshikv/armada-peridot
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.WORKSPACE }}/armada-dodge-peridot

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            python3 python3-venv git wget curl xz-utils cpio gzip \
            device-tree-compiler gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            llvm lld clang android-sdk-platform-tools-common \
            busybox-static kmod mtools dosfstools mkbootimg
          mkdir -p ${{ env.WORKSPACE }}/{firmware,modules,kernel-modules}

      - name: Setup toolchain environment
        run: |
          aarch64-linux-gnu-gcc --version
          clang --version
          mkbootimg --help >/dev/null
          busybox | head -1

      - name: Copy firmware and DTB
        run: |
          cp -a firmware/. ${{ env.WORKSPACE }}/firmware/
          cp peridot.dtb ${{ env.WORKSPACE }}/peridot.dtb
          fdtput -t s ${{ env.WORKSPACE }}/peridot.dtb /chosen bootargs "${{ env.BOOTARGS }}"
          fdtput -d ${{ env.WORKSPACE }}/peridot.dtb /chosen linux,initrd-start || true
          fdtput -d ${{ env.WORKSPACE }}/peridot.dtb /chosen linux,initrd-end || true
          dtc -I dtb -O dts ${{ env.WORKSPACE }}/peridot.dtb >/dev/null
          dtc -I dtb -O dts ${{ env.WORKSPACE }}/peridot.dtb 2>/dev/null \
            | grep -A2 '/chosen' | head -10

      - name: Clone Linux kernel
        run: |
          cd ${{ env.WORKSPACE }}
          git clone --depth 1 --branch v${{ env.KERNEL_VERSION }} \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux-${{ env.KERNEL_VERSION }}

      - name: Apply Peridot patches
        run: |
          cd ${{ env.WORKSPACE }}/linux-${{ env.KERNEL_VERSION }}
          for patch in ${{ env.WORKSPACE }}/armada-dodge-peridot/patches/armada/*.patch; do
            [ -f "$patch" ] || continue
            if git apply "$patch"; then
              echo "applied $(basename "$patch")"
            else
              echo "skipped $(basename "$patch")"
            fi
          done

      - name: Configure kernel
        run: |
          cd ${{ env.WORKSPACE }}/linux-${{ env.KERNEL_VERSION }}
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} defconfig
          printf "%s\n" \
            "CONFIG_DRM_MSM=y" \
            "CONFIG_DRM_MSM_DSI=y" \
            "CONFIG_DRM_MSM_DSI_DSC=y" \
            "CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=y" \
            "CONFIG_TOUCHSCREEN_GOODIX=m" \
            "CONFIG_ATH11K=m" \
            "CONFIG_ATH11K_PCI=m" \
            "CONFIG_BT_HCIUART=m" \
            "CONFIG_BT_HCIUART_H4=y" \
            "CONFIG_BT_HCIUART_QCA=y" \
            "CONFIG_BT_QCA=m" \
            "CONFIG_QCOM_TSENS=y" \
            "CONFIG_QCOM_SPMI_TEMP_ALARM=y" \
            "CONFIG_QCOM_SCMI=y" \
            "CONFIG_QCOM_CPR=y" \
            "CONFIG_QCOM_RPMH=y" \
            "CONFIG_QCOM_GDSC=y" \
            "CONFIG_SERIAL_MSM_GENI=y" \
            "CONFIG_SERIAL_MSM_GENI_CONSOLE=y" \
            "CONFIG_PSTORE=y" \
            "CONFIG_PSTORE_RAM=y" \
            "CONFIG_PSTORE_CONSOLE=y" \
            "CONFIG_PSTORE_PMSG=y" \
            "CONFIG_DEBUG_FS=y" \
            >> .config
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} olddefconfig
          grep -E 'CONFIG_(PSTORE|SERIAL_MSM_GENI|QCOM_TSENS)' .config || true

      - name: Build kernel Image and modules
        run: |
          cd ${{ env.WORKSPACE }}/linux-${{ env.KERNEL_VERSION }}
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            LLVM=${{ env.LLVM }} LD=${{ env.LD }} \
            KCPPFLAGS="-Wno-error=unused-variable" \
            Image modules
          cp arch/arm64/boot/Image ${{ env.WORKSPACE }}/Image
          make ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            INSTALL_MOD_PATH=${{ env.WORKSPACE }}/modules modules_install
          KVER=$(ls ${{ env.WORKSPACE }}/modules/lib/modules/ | head -1)
          tar -C ${{ env.WORKSPACE }}/modules -czf ${{ env.WORKSPACE }}/kernel-modules.tar.gz lib/modules
          du -h ${{ env.WORKSPACE }}/Image ${{ env.WORKSPACE }}/kernel-modules.tar.gz

      - name: Upload kernel + DTB + modules
        uses: actions/upload-artifact@v4
        with:
          name: armada-peridot-kernel
          path: |
            ${{ env.WORKSPACE }}/Image
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/kernel-modules.tar.gz
          retention-days: 30

      - name: Build initramfs
        run: |
          bash scripts/build-initramfs.sh \
            --modules-dir ${{ env.WORKSPACE }}/modules \
            --firmware-dir ${{ env.WORKSPACE }}/firmware \
            --thermal-dir ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1 \
            --module-mode minimal \
            --output ${{ env.WORKSPACE }}/initrd.img

      - name: Build fastboot boot image
        run: |
          bash scripts/make-bootimg.sh \
            --kernel ${{ env.WORKSPACE }}/Image \
            --initrd ${{ env.WORKSPACE }}/initrd.img \
            --dtb ${{ env.WORKSPACE }}/peridot.dtb \
            --cmdline "${{ env.BOOTARGS }}" \
            --output ${{ env.WORKSPACE }}/peridot-boot.img

      - name: Build FAT media image
        run: |
          bash scripts/make-media.sh \
            --image ${{ env.WORKSPACE }}/Image \
            --initrd ${{ env.WORKSPACE }}/initrd.img \
            --dtb ${{ env.WORKSPACE }}/peridot.dtb \
            --modules-dir ${{ env.WORKSPACE }}/modules \
            --firmware-dir ${{ env.WORKSPACE }}/firmware \
            --thermal-dir ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1 \
            --armada-root ${{ env.WORKSPACE }}/armada-root \
            --arch-root ${{ env.WORKSPACE }}/arch-root \
            --steam-extra ${{ env.WORKSPACE }}/steam-extra \
            --size-mb ${{ env.MEDIA_SIZE_MB }} \
            --output ${{ env.WORKSPACE }}/peridot-media.img

      - name: Upload full build
        uses: actions/upload-artifact@v4
        with:
          name: armada-peridot-build
          path: |
            ${{ env.WORKSPACE }}/Image
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/kernel-modules.tar.gz
            ${{ env.WORKSPACE }}/initrd.img
            ${{ env.WORKSPACE }}/peridot-boot.img
            ${{ env.WORKSPACE }}/peridot-media.img
          retention-days: 14

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: armada-peridot-${{ github.run_number }}
          name: "Armada-Dodge Peridot Build #${{ github.run_number }}"
          body: |
            Build artifacts for Xiaomi Peridot (POCO F6 / Redmi Turbo 3) - SM8635

            Kernel: Linux ${{ env.KERNEL_VERSION }}
            Build: ${{ github.run_number }}

            Artifacts:
            - Image (kernel)
            - peridot.dtb (stock device tree, chosen bootargs patched)
            - kernel-modules.tar.gz (lib/modules tree)
            - initrd.img (busybox + modules + firmware)
            - peridot-boot.img (flashless `fastboot boot` image)
            - peridot-media.img (FAT32 RAM media)
          files: |
            ${{ env.WORKSPACE }}/Image
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/kernel-modules.tar.gz
            ${{ env.WORKSPACE }}/initrd.img
            ${{ env.WORKSPACE }}/peridot-boot.img
            ${{ env.WORKSPACE }}/peridot-media.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
