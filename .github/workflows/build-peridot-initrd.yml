name: Build Peridot Initrd & Media (Skip Kernel)

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Run ID of a full build (empty = latest successful full build)'
        required: false
        default: ''
      media_size_mb:
        description: 'FAT media image size in MB'
        required: true
        default: '2048'

concurrency:
  group: armada-peridot-initrd-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: ${{ github.workspace }}/peridot-workspace
  MEDIA_SIZE_MB: ${{ github.event.inputs.media_size_mb || '2048' }}
  BOOTARGS: console=ttyMSM0,115200n8 earlycon loglevel=7 ignore_loglevel

jobs:
  build-initrd-media:
    name: Build Initrd, Boot Image & FAT Media
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout armada-peridot
        uses: actions/checkout@v4
        with:
          repository: hoshikv/armada-peridot
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.WORKSPACE }}/armada-dodge-peridot

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl xz-utils cpio gzip device-tree-compiler \
            busybox-static kmod mtools dosfstools mkbootimg
          mkdir -p ${{ env.WORKSPACE }}/artifact

      - name: Download kernel build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.inputs.kernel_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow build-armada-peridot.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "kernel run: $RUN_ID"
          gh run download "$RUN_ID" --repo "${GITHUB_REPOSITORY}" \
            -n armada-peridot-kernel -D ${{ env.WORKSPACE }}/artifact
          ls -la ${{ env.WORKSPACE }}/artifact
          test -f ${{ env.WORKSPACE }}/artifact/Image
          test -f ${{ env.WORKSPACE }}/artifact/peridot.dtb
          test -f ${{ env.WORKSPACE }}/artifact/kernel-modules.tar.gz

      - name: Extract artifacts
        run: |
          cd ${{ env.WORKSPACE }}
          mv artifact/Image artifact/peridot.dtb artifact/kernel-modules.tar.gz .
          mkdir -p modules
          tar -C modules -xzf kernel-modules.tar.gz
          KVER=$(ls modules/lib/modules/ | head -1)
          echo "KVER=$KVER"

      - name: Copy firmware
        run: |
          mkdir -p ${{ env.WORKSPACE }}/firmware
          cp -a firmware/. ${{ env.WORKSPACE }}/firmware/

      - name: Build initramfs
        run: |
          bash scripts/build-initramfs.sh \
            --modules-dir ${{ env.WORKSPACE }}/modules \
            --firmware-dir ${{ env.WORKSPACE }}/firmware \
            --thermal-dir ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1 \
            --module-mode minimal \
            --output ${{ env.WORKSPACE }}/initrd.img

      - name: Build fastboot boot image
        run: |
          bash scripts/make-bootimg.sh \
            --kernel ${{ env.WORKSPACE }}/Image \
            --initrd ${{ env.WORKSPACE }}/initrd.img \
            --dtb ${{ env.WORKSPACE }}/peridot.dtb \
            --cmdline "${{ env.BOOTARGS }}" \
            --output ${{ env.WORKSPACE }}/peridot-boot.img

      - name: Build FAT media image
        run: |
          bash scripts/make-media.sh \
            --image ${{ env.WORKSPACE }}/Image \
            --initrd ${{ env.WORKSPACE }}/initrd.img \
            --dtb ${{ env.WORKSPACE }}/peridot.dtb \
            --modules-dir ${{ env.WORKSPACE }}/modules \
            --firmware-dir ${{ env.WORKSPACE }}/firmware \
            --thermal-dir ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1 \
            --armada-root ${{ env.WORKSPACE }}/armada-root \
            --arch-root ${{ env.WORKSPACE }}/arch-root \
            --steam-extra ${{ env.WORKSPACE }}/steam-extra \
            --size-mb ${{ env.MEDIA_SIZE_MB }} \
            --output ${{ env.WORKSPACE }}/peridot-media.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armada-peridot-initrd-media
          path: |
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/initrd.img
            ${{ env.WORKSPACE }}/peridot-boot.img
            ${{ env.WORKSPACE }}/peridot-media.img
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: armada-peridot-initrd-${{ github.run_number }}
          name: "Armada-Dodge Peridot Initrd & Media #${{ github.run_number }}"
          body: |
            Build artifacts for Xiaomi Peridot (POCO F6 / Redmi Turbo 3) - SM8635

            Artifacts:
            - peridot.dtb
            - initrd.img (busybox + modules + firmware)
            - peridot-boot.img (flashless `fastboot boot` image)
            - peridot-media.img (FAT32 RAM media)
          files: |
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/initrd.img
            ${{ env.WORKSPACE }}/peridot-boot.img
            ${{ env.WORKSPACE }}/peridot-media.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
