name: Build Peridot Initrd & Media (Skip Kernel)

"on":
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Run ID of the kernel build to download artifact from'
        required: true
        default: '43994070406'

env:
  WORKSPACE: ${{ github.workspace }}/peridot-workspace
  KERNEL_VERSION: '6.12'

jobs:
  build-initrd-media:
    name: Build Initrd & FAT Media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout armada-dodge-peridot
        uses: actions/checkout@v4
        with:
          repository: hoshikv/armada-peridot
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.WORKSPACE }}/armada-dodge-peridot

      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          path: firmware

      - name: Download kernel artifact from artifact API
        run: |
          cd ${{ env.WORKSPACE }}
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -o armada-peridot-kernel.zip \
            "https://api.github.com/repos/hoshikv/armada-builder/actions/artifacts/14286656897/zip"
          unzip armada-peridot-kernel.zip
          ls -la

      - name: Verify kernel artifact
        run: |
          ls -la ${{ env.WORKSPACE }}/
          test -f ${{ env.WORKSPACE }}/Image

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            python3 \
            python3-venv \
            git \
            wget \
            curl \
            xz-utils \
            cpio \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            llvm \
            lld \
            clang \
            android-sdk-platform-tools-common

      - name: Create workspace directories
        run: |
          mkdir -p ${{ env.WORKSPACE }}/firmware
          mkdir -p ${{ env.WORKSPACE }}/kernel-headers

      - name: Copy firmware to workspace
        run: |
          cp -r firmware/* ${{ env.WORKSPACE }}/firmware/
          ls -la ${{ env.WORKSPACE }}/firmware/

      - name: Build Device Tree
        run: |
          cd ${{ env.WORKSPACE }}
          git clone --depth 1 --branch v${{ env.KERNEL_VERSION }} \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux-${{ env.KERNEL_VERSION }} 2>/dev/null || true
          cd linux-${{ env.KERNEL_VERSION }}
          
          # Copy dt-bindings headers from kernel source
          mkdir -p include/dt-bindings/arm
          cp -r include/dt-bindings/arm/* include/dt-bindings/arm/ 2>/dev/null || true
          
          mkdir -p arch/arm64/boot/dts/qcom
          cp -r ${{ env.WORKSPACE }}/armada-dodge-peridot/source/linux/arch/arm64/boot/dts/qcom/* arch/arm64/boot/dts/qcom/
          
          echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8635-peridot.dtb' >> arch/arm64/boot/dts/qcom/Makefile
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=/usr/bin LD=/usr/bin/ld.lld \
            defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=/usr/bin LD=/usr/bin/ld.lld \
            dtbs
          
          sed -i '/sm8635-peridot.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          
          cp arch/arm64/boot/dts/qcom/sm8635-peridot.dtb ../peridot.dtb

      - name: Build initrd
        run: |
          cd ${{ env.WORKSPACE }}
          
          INITRD_DIR=$(mktemp -d)
          mkdir -p $INITRD_DIR/{bin,sbin,etc,lib,lib64,usr/bin,usr/sbin,usr/lib,usr/lib64,proc,sys,dev,run,thermal}
          
          cp ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1/thermal-guard.py $INITRD_DIR/thermal/
          cp ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1/thermal-watchdog.py $INITRD_DIR/thermal/
          
          mkdir -p $INITRD_DIR/lib/firmware
          cp -r firmware/* $INITRD_DIR/lib/firmware/
          
          printf "%s\n" \
            "#!/bin/busybox sh" \
            "mount -t proc none /proc" \
            "mount -t sysfs none /sys" \
            "mount -t devtmpfs none /dev" \
            "mount -t tmpfs none /run" \
            "" \
            "modprobe qcom_tsens" \
            "modprobe qcom_spmi_temp_alarm" \
            "" \
            "/thermal/thermal-guard.py &" \
            "/thermal/thermal-watchdog.py &" \
            "" \
            "modprobe msm_drm" \
            "modprobe panel_xiaomi_peridot" \
            "modprobe goodix" \
            "modprobe ath11k_pci" \
            "modprobe hci_uart" \
            "modprobe qca" \
            "" \
            "exec /sbin/init" \
            > $INITRD_DIR/init
          chmod +x $INITRD_DIR/init
          
          cd $INITRD_DIR
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ${{ env.WORKSPACE }}/initrd.img

      - name: Build FAT media image
        run: |
          cd ${{ env.WORKSPACE }}
          
          STAGE_DIR=$(mktemp -d)
          
          for d in boot modules firmware armada arch steam thermal; do
            mkdir -p $STAGE_DIR/$d
          done
          
          cp Image $STAGE_DIR/boot/
          cp initrd.img $STAGE_DIR/boot/
          cp peridot.dtb $STAGE_DIR/boot/
          
          cp -r firmware/* $STAGE_DIR/firmware/
          
          printf "%s\n" \
            "# Peridot Armada Boot Configuration" \
            "KERNEL=Image" \
            "INITRD=initrd.img" \
            "DTB=peridot.dtb" \
            "BOOTARGS=console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x888000 bootcpu=7 cpus=8 cpufreq=1 fb_hz=120 fb_threads=6 touch_no_rpmh=1 touch_poll_us=4000 thermal=2 metal=1" \
            > $STAGE_DIR/boot/boot.conf
          
          cp -r ${{ env.WORKSPACE }}/armada-dodge-peridot/experimental/peridot-thermal-v1/* $STAGE_DIR/thermal/
          
          MEDIA_SIZE_MB=2048
          SECTOR_SIZE=512
          sectors=$((MEDIA_SIZE_MB * 1024 * 1024 / SECTOR_SIZE))
          
          dd if=/dev/zero of=peridot-media.img bs=$SECTOR_SIZE count=$sectors
          mkfs.vfat -F 32 -n PERIDOT peridot-media.img
          
          MNT_DIR=$(mktemp -d)
          sudo mount -o loop,uid=1000,gid=1000 peridot-media.img $MNT_DIR
          cp -r $STAGE_DIR/* $MNT_DIR/
          sudo umount $MNT_DIR
          
          cp peridot-media.img ${{ env.WORKSPACE }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armada-peridot-initrd-media
          path: |
            ${{ env.WORKSPACE }}/initrd.img
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/peridot-media.img
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: armada-peridot-initrd-${{ github.run_number }}
          name: "Armada-Dodge Peridot Initrd & Media #${{ github.run_number }}"
          body: |
            Build artifacts for Xiaomi Peridot (POCO F6 / Redmi Turbo 3) - SM8635
            
            Artifacts:
            - initrd.img (Initramfs with thermal guard)
            - peridot.dtb (Device tree)
            - peridot-media.img (2GB FAT32 media with userspace)
          files: |
            ${{ env.WORKSPACE }}/initrd.img
            ${{ env.WORKSPACE }}/peridot.dtb
            ${{ env.WORKSPACE }}/peridot-media.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
